{% load static %}  <!-- Добавьте эту строку в самом начале файла -->

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>{% block title %}Мой блог{% endblock %}</title>
    
    <!-- Базовые стили можно подключить здесь -->
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav>
        <a href="/">Главная</a>
        <a href="/create/">Создать статью</a>
    </nav>
    
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    
    <!-- Базовые скрипты можно подключить здесь -->
    <script src="{% static 'js/base.js' %}"></script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
