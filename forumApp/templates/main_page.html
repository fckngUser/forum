{% extends 'base.html' %}

{% block title %}Главная страница{% endblock %}

{% block content %}
<h1>Все статьи</h1>
<ul>
    {% for article in articles %}
    <li>
        <h3>{{ article.name }}</h3>
        <p>{{ article.content|truncatechars:100 }}</p>
    </li>
    {% empty %}
    <li>Статей пока нет</li>
    {% endfor %}
</ul>
{% endblock %}
