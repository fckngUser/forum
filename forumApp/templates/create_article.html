{% extends 'base.html' %}
{% load static %}

{% block title %}Создать статью{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/create_articles.css' %}">
{% endblock %}

{% block content %}

<div class="create-article-container">
    <h1>Создать новую статью</h1>
    <form method="POST" class="article-form">
        {% csrf_token %}
        <div class="form-group">
            <label class="form-label">Название:</label>
            <input type="text" name="name" class="form-input" required>
        </div>
        <div class="form-group">
            <label class="form-label">Содержание:</label>
            <textarea name="content" class="form-textarea" required></textarea>
        </div>
        <button type="submit" class="submit-btn">Создать</button>
    </form>
    <a href="/" class="back-link">Назад к списку</a>
</div>
{% endblock %}
